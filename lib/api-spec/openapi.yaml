openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Public product catalogue
  - name: orders
    description: Authenticated order history and order placement
  - name: checkout
    description: Test-mode Stripe Checkout for signed-in customers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: Browse the product catalogue
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, price_asc, price_desc, name_asc]
      responses:
        "200":
          description: Catalogue results from MongoDB Atlas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "503":
          description: MongoDB Atlas is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get featured products
      responses:
        "200":
          description: Featured catalogue items from MongoDB Atlas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "503":
          description: MongoDB Atlas is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details from MongoDB Atlas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB Atlas is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/sessions:
    post:
      operationId: createCheckoutSession
      tags: [checkout]
      summary: Create a test-mode Stripe Checkout Session for the signed-in customer's cart
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Hosted Stripe Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Invalid cart or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Exchange rates changed; review the updated amount before checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe, MongoDB, or exchange-rate service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/confirm:
    post:
      operationId: confirmCheckoutSession
      tags: [checkout]
      summary: Verify a paid Stripe Checkout Session and record the order
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutConfirmationInput"
      responses:
        "200":
          description: Verified payment and order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid or unavailable Checkout Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Payment is not complete or stock changed before order confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe or MongoDB is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    get:
      operationId: getMyOrders
      tags: [orders]
      summary: Get the signed-in customer's orders
      security:
        - clerkSession: []
      responses:
        "200":
          description: Orders belonging to the current customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB Atlas is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order using server-validated catalogue prices and stock
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Exchange rates changed; review the updated amount before ordering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB Atlas is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CurrencyCode:
      type: string
      enum: [KWD, USD, GBP, EUR, SAR]
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        category:
          type: string
        images:
          type: array
          items:
            type: string
        sizes:
          type: array
          items:
            type: string
        stockQuantity:
          type: integer
          minimum: 0
        featured:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - price
        - category
        - images
        - sizes
        - stockQuantity
        - featured
        - createdAt
    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        categories:
          type: array
          items:
            type: string
      required: [products, categories]
    OrderLineInput:
      type: object
      properties:
        productId:
          type: string
          minLength: 24
          maxLength: 24
        size:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 10
      required: [productId, size, quantity]
    OrderInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/OrderLineInput"
        displayCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        exchangeRateDate:
          type: ["string", "null"]
          format: date-time
          description: UTC date of the exchange rates used for display; null when USD is selected
      required: [items, displayCurrency, exchangeRateDate]
    CheckoutSessionResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]
    CheckoutConfirmationInput:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 10
          maxLength: 255
      required: [sessionId]
    OrderLine:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
        image:
          type: string
        size:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
      required: [productId, name, image, size, quantity, unitPrice]
    Order:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        total:
          type: number
          description: Immutable original order total in the base currency
        baseCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        displayCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        displayTotal:
          type: number
          description: Immutable order total in the currency selected at checkout
        exchangeRate:
          type: number
          description: Number of display-currency units per base-currency unit
        exchangeRateDate:
          type: ["string", "null"]
          format: date-time
          description: UTC date of the exchange rate saved with this order
        status:
          type: string
          enum: [received, preparing, shipped, delivered]
      required: [id, orderNumber, createdAt, items, total, baseCurrency, displayCurrency, displayTotal, exchangeRate, exchangeRateDate, status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

