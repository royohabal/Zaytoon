kind = "web"
previewPath = "/"
title = "Zaytoon Atelier"
description = "A Palestinian heritage fashion storefront for discovering Zaytoon Atelier collections, managing a shopping bag, and viewing personal orders."
version = "1.0.0"
id = "artifacts/zaytoon-store"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api" ]
localPort = 21305

[services.development]
run = "pnpm --filter @workspace/zaytoon-store run dev"

[services.production]
[services.production.build]
args = [ "pnpm", "--filter", "@workspace/zaytoon-store", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/zaytoon-store", "run", "start" ]

[services.production.run.env]
PORT = "21305"
NODE_ENV = "production"

[services.env]
PORT = "21305"
BASE_PATH = "/"
